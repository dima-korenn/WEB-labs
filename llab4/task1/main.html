<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Фітнес-браслет</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-card">
        <img class="product-image" src="bracelet.jpg" alt="Фітнес-браслет Xiaomi Smart Band 9">

        <h2 class="product-title">Xiaomi Smart Band 9</h2>

        <p class="product-property">
            <span class="property-name">Тип дисплею:</span>
            <span class="property-value">AMOLED</span>
        </p>

        <p class="product-property">
            <span class="property-name">Підрахунок кроків:</span>
            <span class="property-value">Так</span>
        </p>

        <p class="product-property">
            <span class="property-name">Пульсометр:</span>
            <span class="property-value">Так</span>
        </p>

        <p class="product-property">
            <span class="property-name">Пульсоксиметр:</span>
            <span class="property-value">Так</span>
        </p>

        <p class="product-property">
            <span class="property-name">Ремінець:</span>
            <span class="property-value">Білмй силіконовий</span>
        </p>

        <div class="button-container">
            <button class="edit-button">Edit</button>
            <button class="delete-button">Delete</button>
        </div>
    </div>
</body>
</html>
