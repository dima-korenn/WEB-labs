<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>My To Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        ul {
            width: 270px;
            padding: 0;
            list-style: none;
        }

        li {
            padding: 10px 15px;
            color: #34495e;
            font-size: 13px;
        }

        li:nth-child(odd) { /* кожен непарний елемент*/
            background-color: #a8cedb;
        }

        li:nth-child(even) { /* кожен парний елемент*/
            background-color: #b5dce7;
        }

        li.done {
            background-color: #dedede;
        }

        .box {
            margin-right: 12px;
            font-size: 16px;
        }

        .done .task {
            text-decoration: line-through;
        }

        .cross {
            margin-left: 18px;
            color: #ef5350;
        }
    </style>
</head>
<body>
    <h2>My To Do List</h2>

    <ul>
        <li><span class="box">&#9744;</span><span class="task">Hit the gym</span><span class="cross">&times;</span></li>
        <li><span class="box">&#9744;</span><span class="task">Pay bills</span><span class="cross">&times;</span></li>
        <li class="done"><span class="box">&#9745;</span><span class="task">Meet John</span><span class="cross">&times;</span></li>
        <li class="done"><span class="box">&#9745;</span><span class="task">Buy eggs</span><span class="cross">&times;</span></li>
        <li><span class="box">&#9744;</span><span class="task">Read a book</span><span class="cross">&times;</span></li>
        <li><span class="box">&#9744;</span><span class="task">Organize office</span><span class="cross">&times;</span></li>
        <li><span class="box">&#9744;</span><span class="task">Eat dinner</span><span class="cross">&times;</span></li>
        <li><span class="box">&#9744;</span><span class="task">Buy apples</span><span class="cross">&times;</span></li>
        <li><span class="box">&#9744;</span><span class="task">Meet Georg</span><span class="cross">&times;</span></li>
        <li class="done"><span class="box">&#9745;</span><span class="task">Feed the cat</span><span class="cross">&times;</span></li>
        <li><span class="box">&#9744;</span><span class="task">Write a letter</span><span class="cross">&times;</span></li>
        <li><span class="box">&#9744;</span><span class="task">Run 1 km</span><span class="cross">&times;</span></li>
    </ul>
</body>
</html>
