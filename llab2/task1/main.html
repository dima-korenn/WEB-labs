<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список фруктів</title>

    <style>
        ol {
            width: 200px;
            margin: 30px auto;
            padding: 15px 10px 15px 35px;
            background-color: #64cfe8;
        }

        li {
            margin: 5px 0;
            padding: 5px;
            background-color: #36b5e3;
            color: rgb(255, 255, 255);
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        li span {
            padding: 5px;
            background-color: #066987;
        }
    </style>
</head>
<body>
    <ol>
        <li><span>Apple</span></li>
        <li><span>Orange</span></li>
        <li><span>Pineapple</span></li>
        <li><span>Pear</span></li>
        <li><span>Cherry</span></li>
    </ol>
</body>
</html>
